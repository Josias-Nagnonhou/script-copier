<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kopi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#17171a;--muted:#6b6b72;--line:#e6e5e0;--accent:#ff3b5c;--accent2:#111;--ok:#1a9b5b;--warn:#c98a00;--err:#d4383a;--soft:#f1f0ec}
:root[data-theme="dark"]{--bg:#111114;--card:#1b1b20;--ink:#f2f2f0;--muted:#9a9aa3;--line:#2c2c33;--accent2:#f2f2f0;--soft:#24242a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111114;--card:#1b1b20;--ink:#f2f2f0;--muted:#9a9aa3;--line:#2c2c33;--accent2:#f2f2f0;--soft:#24242a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
h1{font-size:22px;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);padding:5px;border-radius:12px;margin-bottom:16px}
.seg button{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;font:600 15px Inter,sans-serif;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--muted)}
input,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:15px Inter,sans-serif}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr}}
.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:700 16px Inter,sans-serif;cursor:pointer}
.go:disabled{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.warn{background:#fff4d6;color:#7a5600;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
:root[data-theme="dark"] .warn{background:#3a3016;color:#f0d68a}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.status{font-weight:600}
.list{margin-top:14px;max-height:420px;overflow:auto;border-top:1px solid var(--line)}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--line)}
.dot.working{background:var(--warn);animation:p 1s infinite}.dot.done{background:var(--ok)}.dot.error,.dot.empty{background:var(--err)}
@keyframes p{50%{opacity:.3}}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1;min-width:160px;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Inter,sans-serif;cursor:pointer;text-align:center;text-decoration:none}
.btn.primary{background:var(--accent2);color:var(--bg);border-color:var(--accent2)}
.hidden{display:none}
.err{color:var(--err);font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Ko<span>pi</span></h1><p class="sub">Toutes les transcriptions d'un compte, dans un seul document Word.</p></div>
    <button class="icon-btn" id="theme" title="Mode sombre">◐</button>
  </header>

  <div class="card">
    {% if not groq %}<div class="warn">Clé Groq non configurée : seules les vidéos qui ont déjà des sous-titres pourront être copiées.</div>{% endif %}
    <div class="seg" id="plat">
      <button data-p="tiktok" class="on">TikTok</button>
      <button data-p="youtube">YouTube</button>
    </div>
    <label for="source" id="srcLabel">Nom du compte ou lien</label>
    <input id="source" placeholder="@nomducompte ou https://www.tiktok.com/@..." autocomplete="off">
    <div class="grid">
      <div><label for="limit">Nombre de vidéos</label>
        <select id="limit"><option value="10">10</option><option value="25">25</option><option value="50" selected>50</option><option value="100">100</option><option value="200">200</option><option value="0">Toutes</option></select></div>
      <div><label for="sort">Lesquelles</label>
        <select id="sort"><option value="recent">Les plus récentes</option><option value="popular">Les plus vues</option></select></div>
      <div><label for="lang">Langue parlée</label>
        <select id="lang"><option value="">Auto</option><option value="fr" selected>Français</option><option value="en">Anglais</option><option value="ar">Arabe</option><option value="es">Espagnol</option><option value="pt">Portugais</option></select></div>
      <div id="tabBox" class="hidden"><label for="tab">Type de vidéos</label>
        <select id="tab"><option value="videos">Vidéos longues</option><option value="shorts">Shorts</option></select></div>
    </div>
    <button class="go" id="go">Copier les scripts</button>
    <p class="note">Tu peux aussi coller le lien d'une playlist YouTube ou d'une seule vidéo.</p>
  </div>

  <div class="card hidden" id="jobCard">
    <div class="row"><span class="status" id="status">…</span><span class="note" id="count" style="margin:0"></span></div>
    <div class="bar"><i id="fill"></i></div>
    <div id="error" class="err hidden"></div>
    <div class="actions hidden" id="actions">
      <a class="btn primary" id="dl" href="#">Télécharger le Word</a>
      <button class="btn" id="copy">Copier tout le texte</button>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
let platform='tiktok', timer=null;
// thème
const root=document.documentElement;
try{const t=localStorage.getItem('theme');if(t)root.dataset.theme=t}catch(e){}
$('#theme').onclick=()=>{const dark=root.dataset.theme==='dark'||(!root.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}};
// plateforme
document.querySelectorAll('#plat button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#plat button').forEach(x=>x.classList.remove('on'));b.classList.add('on');platform=b.dataset.p;
  $('#tabBox').classList.toggle('hidden',platform!=='youtube');
  $('#source').placeholder=platform==='tiktok'?'@nomducompte ou https://www.tiktok.com/@...':'@nomdelachaine ou https://www.youtube.com/@...';
});
$('#go').onclick=async()=>{
  const source=$('#source').value.trim(); if(!source){$('#source').focus();return}
  $('#go').disabled=true;
  const r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform,source,limit:$('#limit').value,sort:$('#sort').value,lang:$('#lang').value,yt_tab:$('#tab').value})});
  const d=await r.json();
  if(!r.ok){alert(d.error||'Erreur');$('#go').disabled=false;return}
  try{localStorage.setItem('job',d.job_id)}catch(e){}
  watch(d.job_id);
};
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function watch(id){
  $('#jobCard').classList.remove('hidden');$('#actions').classList.add('hidden');$('#error').classList.add('hidden');
  clearInterval(timer);
  const tick=async()=>{
    let d;try{const r=await fetch('/api/job/'+id);d=await r.json();if(!r.ok)throw d}catch(e){clearInterval(timer);$('#status').textContent='';$('#error').textContent=(e&&e.error)||'Connexion perdue';$('#error').classList.remove('hidden');$('#go').disabled=false;try{localStorage.removeItem('job')}catch(_){}return}
    const items=d.items, fin=items.filter(i=>['done','error','empty'].includes(i.status)).length, ok=items.filter(i=>i.status==='done').length;
    const labels={queued:'En attente…',listing:'Recherche des vidéos du compte…',transcribing:`Transcription en cours — ${d.source_name}`,done:`Terminé — ${ok} scripts prêts`,error:'Arrêté'};
    $('#status').textContent=labels[d.phase]||d.phase;
    $('#count').textContent=items.length?`${fin} / ${items.length}`:'';
    $('#fill').style.width=items.length?(fin/items.length*100)+'%':(d.phase==='listing'?'8%':'0');
    $('#list').innerHTML=items.map(i=>`<div class="item"><span class="dot ${i.status}"></span><div class="t"><b>${i.n}. ${esc(i.title)||esc(i.url)}</b><small>${i.status==='done'?`${i.method} · ${i.chars} caractères`:esc(i.msg)||(i.status==='pending'?'En attente':'En cours…')}</small></div></div>`).join('');
    if(d.phase==='error'){$('#error').textContent=d.error;$('#error').classList.remove('hidden')}
    if(d.phase==='done'||d.phase==='error'){clearInterval(timer);$('#go').disabled=false;
      if(d.has_file){$('#actions').classList.remove('hidden');$('#dl').href='/api/job/'+id+'/docx';
        $('#copy').onclick=async()=>{const t=await (await fetch('/api/job/'+id+'/text')).text();await navigator.clipboard.writeText(t);$('#copy').textContent='Copié ✓';setTimeout(()=>$('#copy').textContent='Copier tout le texte',2000)}}}
  };
  tick();timer=setInterval(tick,2500);
}
try{const j=localStorage.getItem('job');if(j)watch(j)}catch(e){}
</script>
</body>
</html>
