<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kopi</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="icon" href="/static/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><meta name="theme-color" content="#111111">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#111;--line:#e7e6e0;--soft:#f1f0ea}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f11;--card:#18181b;--ink:#f3f3ee;--line:#2b2b30;--soft:#222226}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px 'Manrope',system-ui,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;width:100%;max-width:360px}
.logo{font:800 28px 'Bricolage Grotesque',sans-serif;display:flex;align-items:center;gap:9px;margin:0 0 20px}
.logo em{width:30px;height:30px;border-radius:9px;background:#111;color:#d7ff3a;display:grid;place-items:center;font-style:normal;font-size:17px}
input{width:100%;box-sizing:border-box;padding:14px;border:2px solid var(--ink);border-radius:13px;background:var(--card);color:var(--ink);font:600 15px 'Manrope',sans-serif}
button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:13px;background:#111;color:#d7ff3a;font:800 16px 'Manrope',sans-serif;cursor:pointer}
p.e{color:#d4383a;margin:10px 0 0;font-weight:700}
</style></head><body>
<form method="post"><p class="logo"><em>K</em>Kopi</p>
<input type="password" name="password" placeholder="Mot de passe" autofocus>
<button>Entrer</button>{% if err %}<p class="e">{{ err }}</p>{% endif %}</form>
</body></html>
