<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kopi</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#17171a;--line:#e6e5e0}
@media (prefers-color-scheme:dark){:root{--bg:#111114;--card:#1b1b20;--ink:#f2f2f0;--line:#2c2c33}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:340px}
h1{margin:0 0 16px;font-size:20px}h1 span{color:#ff3b5c}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px}
button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:#ff3b5c;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
p{color:#d4383a;margin:10px 0 0}
</style></head><body>
<form method="post"><h1>Ko<span>pi</span></h1>
<input type="password" name="password" placeholder="Mot de passe" autofocus>
<button>Entrer</button>{% if err %}<p>{{ err }}</p>{% endif %}</form>
</body></html>
